name: Test MPI periodic EOM-CCSD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-mpi:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.13"

      - name: Install Open MPI
        run: |
          sudo apt-get update
          sudo apt-get install -y openmpi-bin libopenmpi-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools<80" "wheel<0.46"
          python -m pip install numpy==1.26.4 scipy==1.13.0 psutil==5.9.8
          python -m pip install --no-build-isolation mpi4py==3.1.5
          python -m pip install pyscf==2.10.0
          python -m pip check

      - name: Check installed versions
        run: |
          python --version
          python -c "import numpy; print('numpy:', numpy.__version__)"
          python -c "import scipy; print('scipy:', scipy.__version__)"
          python -c "import mpi4py; print('mpi4py:', mpi4py.__version__)"
          python -c "import psutil; print('psutil:', psutil.__version__)"
          python -c "import pyscf; print('pyscf:', pyscf.__version__)"

      - name: Run MPI code
        run: |
          mpirun --oversubscribe -n 2 python mpi_eomccsd.py
